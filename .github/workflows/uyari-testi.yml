# ARIZA UYARISI TESTİ — elle çalıştırılır, zamanlanmış tetikleyicisi yok.
#
# Gerçek yayın işindeki uyarı adımının BİREBİR aynısı: bir adım kasten
# düşüyor, ardından `if: failure()` ile uyari.py çalışıyor. Aynı
# secret'lar, aynı kod yolu. Amaç "arıza olunca mail geliyor mu"
# sorusunu tahminle değil gerçek koşuyla cevaplamak.
name: Arıza uyarısı testi (elle)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kasten düşen adım
        run: |
          echo "Bu adım bilerek başarısız oluyor — uyarı yolunu sınamak için." | tee /tmp/adim.log
          exit 1

      - name: Arıza e-postası
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UYARI_ADRESI: ${{ secrets.UYARI_ADRESI }}
          GONDEREN_ADRES: ${{ vars.GONDEREN_ADRES }}
        run: |
          python3 uyari.py "OVERNIGHT · UYARI TESTİ ($(date -u +%Y-%m-%d %H:%M) UTC)" \
            "Bu bir testtir — gerçek bir arıza yok." \
            "Uyarı yolunun çalıştığını doğrulamak için elle tetiklendi." \
            "Son satırlar: $(tail -n 3 /tmp/adim.log 2>/dev/null | tr '\n' ' ')" \
            "Tam kayıt: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
