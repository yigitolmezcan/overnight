# ABONE SAYISI — elle çalıştırılır, SADECE SAYAR, mail göndermez,
# adresleri de yazdırmaz (kayıtlar depoda kalıyor). Test sonrası silinir.
name: Abone say (elle)
on:
  workflow_dispatch:
jobs:
  say:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          python3 -c "
import bulten
liste = bulten.aboneleri_getir()
print('ONAYLI ABONE SAYISI:', len(liste))
# Adresler YAZDIRILMIYOR — koşu kayıtları depoda ve herkese açık.
print('alan adları:', sorted({a.split(chr(64))[-1] for a in liste}))
"
