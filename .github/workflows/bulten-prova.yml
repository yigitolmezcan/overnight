# BÜLTEN PROVA — elle çalıştırılır, tek adrese gider, liste kullanılmaz.
# Yeni düzenin Gmail'de hangi sekmeye düştüğünü görmek için.
# Test bitince silinecek.
name: Bülten prova (elle)
on:
  workflow_dispatch:
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ABONE_GIZLI_ANAHTAR: ${{ secrets.ABONE_GIZLI_ANAHTAR }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          SITE_ADRESI: ${{ vars.SITE_ADRESI }}
          GONDEREN_ADRES: ${{ vars.GONDEREN_ADRES }}
          UYARI_ADRESI: ${{ secrets.UYARI_ADRESI }}
        run: python3 bulten.py gonder --prova "$UYARI_ADRESI"
