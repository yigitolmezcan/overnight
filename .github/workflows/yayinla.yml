name: Yayınla (09:00 TSİ)

on:
  schedule:
    # ÜÇ SLOT (bkz. uret.yml'deki gerekçe). İdempotent: hazır gece
    # yoksa hiçbir şey yapmıyor, yayınlanmışsa tekrar yayınlamıyor.
    # Gecikme telafisi — 09:00 kaçarsa 09:30, o da kaçarsa 10:00.
    - cron: "0 6 * * *"     # 09:00 TSİ (asıl)
    - cron: "30 6 * * *"    # 09:30 TSİ (telafi)
    - cron: "0 7 * * *"     # 10:00 TSİ (son şans)
  workflow_dispatch:

concurrency:
  group: overnight-yayin
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # BU ADIM EKSİKTİ ve site 22 Aralık'ı GÜNLERCE yayınlayamadı.
      # yayin.py -> yaz -> dogrula -> gercekler zinciri nba_api'yi
      # modül düzeyinde içeri alıyor; yayın işi hiç bağımlılık
      # kurmadığı için daha ilk import'ta düşüyordu. Üretim işinde bu
      # adım vardı, yayın işinde yoktu — ikisi ayrı ayrı yazıldığı için
      # fark uzun süre görünmedi. test_dogrula_bozuk artık python
      # çalıştıran her işte bu adımı arıyor.
      - name: Bağımlılıklar
        run: pip install -r requirements.txt

      # Hazır gece yoksa bu adım hiçbir şey yapmaz ve iş BAŞARILI biter —
      # site olduğu gibi kalır. Kullanıcı kuralı: "Site sessizce boş
      # kalmasın, hata halinde bir önceki gece durmaya devam etsin."
      - name: Hazır geceyi siteye göm
        id: gomme
        run: |
          set -o pipefail
          python3 yayin.py yayinla 2>&1 | tee /tmp/adim.log

      - name: Siteyi depoya yaz (Vercel bu push'la deploy eder)
        run: |
          # YAZAR KİMLİĞİ VERCEL TARAFINDAN DENETLENİYOR. "overnight-bot"
          # kullanıldığında Vercel dağıtımı reddediyor:
          #   readyStateReason: "The Deployment was blocked because the
          #   commit author does not have contributing access"
          #   seatBlock.blockCode: TEAM_ACCESS_REQUIRED
          # Ölçüldü: bot yazarlı 6 dağıtımın 6'sı BLOCKED, hesap yazarlı
          # 30 dağıtımın 30'u READY. Yani otomatik yayın siteye HİÇ
          # ulaşmıyordu. Otomatik olduğu commit MESAJINDAN belli oluyor.
          git config user.name  "yigitolmezcan"
          git config user.email "yigitolmezcan@gmail.com"
          # YAYININ ÜRETTİĞİ HER ŞEY GİDER. Eskiden sadece index.html ve
          # durum dosyası ekleniyordu; oysa _siteyi_kur ayrıca gecenin
          # KENDİ sayfasını (site/<tarih>.html), arşiv listesini
          # (site/gunler.json) ve paylaşım görselini (og/<tarih>.png)
          # üretiyor. Üçü de depoya hiç girmiyordu. Sonuç (22 Aralık,
          # 29 Ağustos): /2025-12-22 adresi 404, gece arşivde yok, ve
          # sayfanın og:image etiketi var olmayan bir görseli
          # gösteriyordu — paylaşılan her link kırık önizleme veriyordu.
          # Hiçbir denetim bunu yakalamadı çünkü hepsi index.html'e
          # bakıyordu.
          git add site og config/yayin_durumu.json
          if git diff --staged --quiet; then
            echo "Yayınlanacak yeni gece yoktu — site aynen kaldı."
          else
            git commit -m "yayın: $(python3 -c "import json;d=json.load(open('config/yayin_durumu.json'));print(d['yayinlanan'][-1] if d['yayinlanan'] else '-')")"
            git push
          fi

      # DEPO DEĞİL, OKUYUCUNUN GÖRDÜĞÜ SAYFA ÖLÇÜT.
      # 27 Ağustos 2026: iş kusursuz koştu, 21 Aralık'ı depoya yazdı,
      # "success" dedi — ve site 20 Aralık'ta kaldı. Vercel bot yazarlı
      # commit'in dağıtımını reddediyordu (TEAM_ACCESS_REQUIRED) ve
      # bunu kimse görmedi, çünkü bütün denetimler depoya bakıyordu.
      # Yazar kimliği düzeltildi; bu adım o sınıfın TEKRARINI yakalıyor
      # (dağıtım reddedilse de, düşse de, assa da).
      - name: Site gerçekten değişti mi
        id: canli
        run: |
          # pipefail ŞART: GitHub Actions kabuğu `bash -e` ile koşuyor,
          # `-o pipefail` ile DEĞİL. Onsuz borunun çıkış kodu `tee`nin
          # kodudur — yani her zaman 0 — ve denetim düşse bile adım
          # başarılı görünür. Koruma tam da yakalamak istediği sınıfa
          # kendisi düşerdi.
          set -o pipefail
          BEKLENEN=$(python3 -c "import json;d=json.load(open('config/yayin_durumu.json'));print(d['yayinlanan'][-1] if d['yayinlanan'] else '')")
          if [ -z "$BEKLENEN" ]; then
            echo "Yayınlanmış gece yok — denetlenecek bir şey de yok."
            exit 0
          fi
          python3 canli_dogrula.py "$BEKLENEN" 2>&1 | tee /tmp/canli.log

      - name: Canlıya çıkmadı — issue aç
        if: failure() && steps.canli.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Site canlıya çıkmadı — $(date -u +%Y-%m-%d)" \
            --body "$(printf 'Yayın işi başarılı bitti ve depoya yazdı, ama canlı site hâlâ eski geceyi gösteriyor.\n\nBu genelde DAĞITIM katmanında bir engel demek (Vercel reddi, düşen build, asılı dağıtım) — üretim boru hattında değil.\n\n```\n%s\n```\n\nKayıtlar: %s/%s/actions/runs/%s' "$(tail -n 12 /tmp/canli.log 2>/dev/null)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")" \
            --assignee yigitolmezcan \
            || echo "issue açılamadı"

      # Bülten SADECE yeni bir gece yayınlandıysa gider. `yayin.py`
      # yayınlamadıysa (hazır gece yok, ya da doğrulama kapısı tuttu)
      # durum dosyasındaki son_bulten zaten güncel kalır ve bulten.py
      # kendiliğinden hiçbir şey göndermez — kullanıcı kuralı: "Site
      # yayınlanmadıysa mail de gitmesin."
      - name: Bülteni gönder
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ABONE_GIZLI_ANAHTAR: ${{ secrets.ABONE_GIZLI_ANAHTAR }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          SITE_ADRESI: ${{ vars.SITE_ADRESI }}
          GONDEREN_ADRES: ${{ vars.GONDEREN_ADRES }}
        run: |
          set -o pipefail
          python3 bulten.py gonder 2>&1 | tee -a /tmp/adim.log

      - name: Bülten kaydını depoya yaz
        if: always()
        run: |
          # YAZAR KİMLİĞİ VERCEL TARAFINDAN DENETLENİYOR. "overnight-bot"
          # kullanıldığında Vercel dağıtımı reddediyor:
          #   readyStateReason: "The Deployment was blocked because the
          #   commit author does not have contributing access"
          #   seatBlock.blockCode: TEAM_ACCESS_REQUIRED
          # Ölçüldü: bot yazarlı 6 dağıtımın 6'sı BLOCKED, hesap yazarlı
          # 30 dağıtımın 30'u READY. Yani otomatik yayın siteye HİÇ
          # ulaşmıyordu. Otomatik olduğu commit MESAJINDAN belli oluyor.
          git config user.name  "yigitolmezcan"
          git config user.email "yigitolmezcan@gmail.com"
          git add config/yayin_durumu.json
          if ! git diff --staged --quiet; then
            git pull --rebase --autostash -q
            git commit -m "bülten gönderildi"
            git push
          fi

      # Kullanıcı kuralı: her koşu, sonucu ne olursa olsun iz bıraksın.
      # if: always() — adımlardan biri düşse bile bu çalışır, yoksa
      # "çalıştı mı çalışmadı mı" sorusu tahmine kalıyor.
      # Zamanlayıcı sessizce durursa hiçbir hata oluşmaz, sadece site
      # eskir. Bu adım onu yakalıyor: iş koştuğu HÂLDE yayın bayatsa
      # bildirim açılıyor.
      - name: Bayatlık kontrolü
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! python3 kosu_kaydi.py --bayatlik; then
            gh issue create \
              --title "Yayın bayat — $(date -u +%Y-%m-%d)" \
              --body "İş koştu ama son yayının üstünden eşikten fazla gün geçmiş. Site eskiyor. Kayıtlar: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              || echo "issue açılamadı" \
            --assignee yigitolmezcan
          fi

      - name: Koşu kaydı bırak
        if: always()
        run: |
          python3 kosu_kaydi.py yayinla "${{ job.status }}" "run ${{ github.run_number }} · ${{ github.event_name }}"
          # YAZAR KİMLİĞİ VERCEL TARAFINDAN DENETLENİYOR. "overnight-bot"
          # kullanıldığında Vercel dağıtımı reddediyor:
          #   readyStateReason: "The Deployment was blocked because the
          #   commit author does not have contributing access"
          #   seatBlock.blockCode: TEAM_ACCESS_REQUIRED
          # Ölçüldü: bot yazarlı 6 dağıtımın 6'sı BLOCKED, hesap yazarlı
          # 30 dağıtımın 30'u READY. Yani otomatik yayın siteye HİÇ
          # ulaşmıyordu. Otomatik olduğu commit MESAJINDAN belli oluyor.
          git config user.name  "yigitolmezcan"
          git config user.email "yigitolmezcan@gmail.com"
          git add config/kosu_kaydi.json
          if ! git diff --staged --quiet; then
            git pull --rebase --autostash -q || true
            git commit -m "koşu kaydı: yayinla ${{ job.status }}"
            git push || echo "koşu kaydı push edilemedi (yarışma) — kayıt yine de üretildi"
          fi

      # Kullanıcı kuralı: "Başarısızsa bana e-posta gelsin." Issue kalıyor
      # (izlenebilirlik), üstüne mail ekleniyor — kimse Issues sekmesine
      # bakmıyor. UYARAMAMAK DA BİR ARIZADIR (kullanıcı kuralı):
      # uyari.py gönderemezse 1 dönüyor ve bu adım KIRMIZI yanıyor.
      # Eskiden ayar yoksa sessizce 0 dönüyordu; 28-29 Ağustos'ta
      # yayın iki gün düştü, bu adım her seferinde yeşil göründü ve
      # kimseye haber gitmedi. İş zaten failure() olduğu için burada
      # kırmızı olmak işin sonucunu değiştirmiyor, sadece 'haber de
      # veremedim'i kayda geçiriyor. Sonraki bildirim adımı da
      # failure() olduğu için çalışmaya devam ediyor.
      - name: Arıza e-postası
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UYARI_ADRESI: ${{ secrets.UYARI_ADRESI }}
          GONDEREN_ADRES: ${{ vars.GONDEREN_ADRES }}
        run: |
          python3 uyari.py "OVERNIGHT · yayın işi başarısız ($(date -u +%Y-%m-%d))" \
            "yayın işi düştü." \
            "Son satırlar: $(tail -n 6 /tmp/adim.log 2>/dev/null | tr '\n' ' ' | cut -c1-400)" \
            "Tam kayıt: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Hata bildirimi
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "09:00 yayın işi düştü."
            echo ""
            echo "### Hatanın son satırları"
            echo ""
            echo '```'
            tail -n 40 /tmp/adim.log 2>/dev/null || echo "(adım çıktısı yakalanamadı)"
            echo '```'
            echo ""
            echo "Tam kayıt: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/issue.md
          gh issue create \
            --title "Yayın işi başarısız — $(date -u +%Y-%m-%d)" \
            --body-file /tmp/issue.md \
            --assignee yigitolmezcan
