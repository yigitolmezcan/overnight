# BÜLTEN GÖNDERİM TESTİ — elle çalıştırılır.
#
# Gerçek yayın işindeki "Bülteni gönder" adımının birebir aynısı, aynı
# secret'larla. Amaç: bültenin sabah 09:00'ı beklemeden GERÇEKTEN
# gittiğini görmek. Upstash'ten liste okuma + Resend'den gönderme +
# List-Unsubscribe başlıkları, hepsi tek koşuda sınanıyor.
#
# Test bitince silinecek.
name: Bülten gönderim testi (elle)

on:
  workflow_dispatch:

jobs:
  gonder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bülteni gönder
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ABONE_GIZLI_ANAHTAR: ${{ secrets.ABONE_GIZLI_ANAHTAR }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          SITE_ADRESI: ${{ vars.SITE_ADRESI }}
          GONDEREN_ADRES: ${{ vars.GONDEREN_ADRES }}
        run: |
          set -o pipefail
          python3 bulten.py gonder
