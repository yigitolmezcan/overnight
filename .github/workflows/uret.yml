name: Gece üret (08:30 TSİ)

on:
  schedule:
    # GitHub cron UTC çalışır; Türkiye yıl boyu UTC+3 (yaz saati yok).
    #
    # ÜÇ SLOT, tek değil. Ölçüm (2026-08-26): GitHub zamanlanmış işi
    # 27 dk gecikmeyle başlattı, yayın işini 41 dk. Tek slota bağlıyken
    # gecikme doğrudan yayın saatine biniyor ve "09:00'da yayında"
    # vaadi tutmuyor. Slotlar İDEMPOTENT: hazır gece varsa üretim
    # atlanıyor, yani fazladan koşu zarar vermiyor, sadece kaçan slotu
    # telafi ediyor.
    #
    # ARŞİV MODU: veri her zaman hazır, o yüzden çok erken üretiyoruz.
    #   02:00 UTC = 05:00 TSİ  (asıl)
    #   04:00 UTC = 07:00 TSİ  (telafi)
    #   05:30 UTC = 08:30 TSİ  (son şans)
    # CANLI MODA geçince ilk iki slot ÇALIŞMAZ — o saatte maçlar
    # bitmemiş olur. Canlı modda 05:30 UTC (08:30 TSİ) ve sonrası
    # kullanılmalı; `python3 yayin.py canli` bunu hatırlatıyor.
    - cron: "0 2 * * *"
    - cron: "0 4 * * *"
    - cron: "30 5 * * *"
  workflow_dispatch:        # elle de çalıştırılabilsin (düğmeyle)

concurrency:
  group: overnight-yayin    # üret ve yayınla asla aynı anda commit atmasın
  cancel-in-progress: false

permissions:
  contents: write           # üretilen geceyi depoya commit'lemek için
  issues: write             # hata halinde bildirim issue'su açmak için

jobs:
  uret:
    runs-on: ubuntu-latest
    # 60 dk: NBA yavaşladığında yeniden denemeler süreyi uzatıyor.
    # En kötü durum hesabı ~39 dk (46 çağrı × 3 deneme × 15 sn), üstüne
    # pay bırakıldı.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bağımlılıklar
        id: kurulum
        run: pip install -r requirements.txt

      - name: Testler (bozuk kod yayına çıkmasın)
        id: testler
        run: |
          set -o pipefail
          python3 test_dogrula_bozuk.py 2>&1 | tee /tmp/adim.log

      - name: Sıradaki geceyi üret
        id: uretim
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GUNLUK_BUTCE_USD: "1.00"
        run: |
          set -o pipefail
          # ÜÇ DENEME, aralarında 10 dakika.
          #
          # Neden: gecenin üretilebilmesi için NBA'in veri servisine bir
          # kez ulaşmak yetiyor, ama o servis dönemsel olarak tıkanıyor
          # (27 Ağustos: saatlerce HTTP 000, hem koşucudan hem yerelden).
          # Zamanlayıcı bize günde tek tetikleme veriyor; o tetikleme
          # tıkanmanın ortasına denk gelirse gece kaybediliyordu.
          #
          # Süre hesabı: cek.py'nin kendi bütçesi tıkalı serviste ~70
          # saniyede pes ediyor (ölçüldü), üç deneme + iki bekleme ≈ 25
          # dakika. İş tavanı 60 dakika, rahat sığıyor.
          #
          # İş İDEMPOTENT: hazır gece varsa `yayin.py uret` zaten hiçbir
          # şey yapmadan çıkıyor, o yüzden başarılı denemeden sonra
          # döngü kırılıyor.
          # ÜÇ DENEME → İKİ. Ölçüldü (28 Ağustos): NBA servisi GitHub
          # koşucusunu engelliyor, aynı gün 3/3 deneme aynı ReadTimeout
          # ile düştü ve her koşu 26 dakika sürdü. Aynı engelde üçüncü
          # denemenin getirisi yok, maliyeti var: GitHub zamanlanmış
          # işleri yoğun kullanan depolarda geciktiriyor ve bu iş
          # gecikmenin kendisini besliyor.
          for deneme in 1 2; do
            echo "--- üretim denemesi $deneme/2 ---"
            set +e
            python3 yayin.py uret 2>&1 | tee -a /tmp/adim.log
            KOD=${PIPESTATUS[0]}
            set -e
            if [ "$KOD" -eq 0 ]; then
              echo "deneme $deneme başarılı"
              exit 0
            fi
            # 2 = şablona düşme alarmı. Tekrar denemek anlamsız: gece
            # zaten "hazır" işaretli, ikinci tur "zaten hazır gece var"
            # deyip 0 döner ve alarm sessizce yutulurdu.
            if [ "$KOD" -eq 2 ]; then
              echo "sablon_alarmi=1" >> "$GITHUB_OUTPUT"
              echo "Şablona düşme alarmı — tekrar denenmiyor."
              exit 2
            fi
            # 3 = hiçbir gecenin verisine ULAŞILAMADI (sezon sonu değil).
            # Tekrar denemenin anlamı var: engel dönemsel olabilir. Ama
            # son denemede de olmuyorsa iş DÜŞMELİ, sessizce "gece yok"
            # deyip geçmemeli.
            if [ "$KOD" -eq 3 ]; then
              echo "veri_erisimi=1" >> "$GITHUB_OUTPUT"
              echo "Gecelerin verisine ulaşılamadı."
              if [ "$deneme" -ge 2 ]; then exit 3; fi
            fi
            if [ "$deneme" -lt 2 ]; then
              echo "deneme $deneme düştü, 5 dakika sonra tekrar denenecek"
              sleep 300
            fi
          done
          echo "iki denemede de üretilemedi"
          exit 1

      - name: Sonucu depoya yaz
        id: yazma
        run: |
          # YAZAR KİMLİĞİ VERCEL TARAFINDAN DENETLENİYOR. "overnight-bot"
          # kullanıldığında Vercel dağıtımı reddediyor:
          #   readyStateReason: "The Deployment was blocked because the
          #   commit author does not have contributing access"
          #   seatBlock.blockCode: TEAM_ACCESS_REQUIRED
          # Ölçüldü: bot yazarlı 6 dağıtımın 6'sı BLOCKED, hesap yazarlı
          # 30 dağıtımın 30'u READY. Yani otomatik yayın siteye HİÇ
          # ulaşmıyordu. Otomatik olduğu commit MESAJINDAN belli oluyor.
          git config user.name  "yigitolmezcan"
          git config user.email "yigitolmezcan@gmail.com"
          git add config/yayin_durumu.json gercek dist skor taslak
          if git diff --staged --quiet; then
            echo "Değişiklik yok — commit atlanıyor."
          else
            git commit -m "üret: $(python3 -c "import json;print(json.load(open('config/yayin_durumu.json')).get('hazir',{}).get('tarih','-'))")"
            git push
          fi

      - name: Bütçe tavanı uyarısı
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASILDI=$(python3 -c "import json;d=json.load(open('config/yayin_durumu.json'));h=d.get('hazir') or {};print('evet' if h.get('butce_asildi') else 'hayir')")
          if [ "$ASILDI" = "evet" ]; then
            gh issue create \
              --title "Bütçe tavanı aşıldı — gece şablon moduna düştü" \
              --body "Günlük \$0.30 tavanına ulaşıldı. Gecenin kalanı şablonla üretildi; yayın normal saatinde çıkacak, sadece metinler LLM yerine şablondan geliyor. Ayrıntı: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --assignee yigitolmezcan
          fi

      # Kullanıcı kuralı: her koşu, sonucu ne olursa olsun iz bıraksın.
      # if: always() — adımlardan biri düşse bile bu çalışır, yoksa
      # "çalıştı mı çalışmadı mı" sorusu tahmine kalıyor.
      - name: Koşu kaydı bırak
        if: always()
        run: |
          python3 kosu_kaydi.py uret "${{ job.status }}" "run ${{ github.run_number }} · ${{ github.event_name }}"
          # YAZAR KİMLİĞİ VERCEL TARAFINDAN DENETLENİYOR. "overnight-bot"
          # kullanıldığında Vercel dağıtımı reddediyor:
          #   readyStateReason: "The Deployment was blocked because the
          #   commit author does not have contributing access"
          #   seatBlock.blockCode: TEAM_ACCESS_REQUIRED
          # Ölçüldü: bot yazarlı 6 dağıtımın 6'sı BLOCKED, hesap yazarlı
          # 30 dağıtımın 30'u READY. Yani otomatik yayın siteye HİÇ
          # ulaşmıyordu. Otomatik olduğu commit MESAJINDAN belli oluyor.
          git config user.name  "yigitolmezcan"
          git config user.email "yigitolmezcan@gmail.com"
          git add config/kosu_kaydi.json
          if ! git diff --staged --quiet; then
            git pull --rebase --autostash -q || true
            git commit -m "koşu kaydı: uret ${{ job.status }}"
            git push || echo "koşu kaydı push edilemedi (yarışma) — kayıt yine de üretildi"
          fi

      # Kullanıcı kuralı: "Başarısızsa bana e-posta gelsin." Issue kalıyor
      # (izlenebilirlik), üstüne mail ekleniyor — kimse Issues sekmesine
      # bakmıyor. UYARAMAMAK DA BİR ARIZADIR (kullanıcı kuralı):
      # uyari.py gönderemezse 1 dönüyor ve bu adım KIRMIZI yanıyor.
      # Eskiden ayar yoksa sessizce 0 dönüyordu; 28-29 Ağustos'ta
      # yayın iki gün düştü, bu adım her seferinde yeşil göründü ve
      # kimseye haber gitmedi. İş zaten failure() olduğu için burada
      # kırmızı olmak işin sonucunu değiştirmiyor, sadece 'haber de
      # veremedim'i kayda geçiriyor. Sonraki bildirim adımı da
      # failure() olduğu için çalışmaya devam ediyor.
      - name: Arıza e-postası
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UYARI_ADRESI: ${{ secrets.UYARI_ADRESI }}
          GONDEREN_ADRES: ${{ vars.GONDEREN_ADRES }}
        run: |
          python3 uyari.py "OVERNIGHT · üretim işi başarısız ($(date -u +%Y-%m-%d))" \
            "üretim işi düştü." \
            "Son satırlar: $(tail -n 6 /tmp/adim.log 2>/dev/null | tr '\n' ' ' | cut -c1-400)" \
            "Tam kayıt: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      # Kullanıcı kuralı: "Sessizce şablona düşmek kabul edilebilir bir
      # sonuç değil." Alarm çaldığında iş zaten kırmızı; burada ayrıca
      # ATANMIŞ issue açılıyor (atanmamış issue için GitHub e-posta
      # garanti etmiyor — 26 Ağustos'ta bunun bedeli ödendi).
      # Kullanıcı kuralı: "Sistem sessizce durmasın — o geceyi atlayıp
      # bir sonrakine geçsin ve bana bildirsin." Atlama sonraki_gece
      # içinde yapılıyor; bildirimi bu adım yapıyor.
      - name: Veri erişilemedi — issue aç
        if: failure() && steps.uretim.outputs.veri_erisimi == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Gece verisi çekilemedi — $(date -u +%Y-%m-%d)" \
            --body "$(printf 'Sıradaki arşiv gecelerinin hiçbirinin verisine ulaşılamadı, o yüzden bu sabah yeni gece üretilmedi. Site bir önceki gecede kaldı.\n\nBİLİNEN SEBEP: NBA veri servisi GitHub koşucusunun IP blokunu (Azure) engelliyor. Ölçüldü: aynı istek yerel makineden 0.5 saniyede dönüyor, koşucudan 25 saniyede zaman aşımına uğruyor. Kalıcı çözüm vekil sunucu (bkz. şartname, Çözülmemiş engeller).\n\nAtlanan geceler ve sebepleri:\n\n```\n%s\n```\n\nKayıtlar: %s/%s/actions/runs/%s' "$(grep -A 20 "verisine ulaşılamadı" /tmp/adim.log 2>/dev/null | head -20)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")" \
            --assignee yigitolmezcan \
            || echo "issue açılamadı"

      - name: Şablona düşme alarmı — issue aç
        if: failure() && steps.uretim.outputs.sablon_alarmi == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Mutlaka bil şablona düştü — $(date -u +%Y-%m-%d)" \
            --body "$(printf 'Gecenin Mutlaka bil maçlarının yarısından fazlası LLM metni yerine şablonla yazıldı; üretim başarısız sayıldı.\n\nGece **hazır** işaretli kaldı — üretim boşa gitmesin diye siliniyor değil. Karar insanın: ya kurallar/prompt düzeltilip `python3 yaz.py <tarih> --force` ile yeniden yazılır, ya da olduğu gibi yayınlanır.\n\n```\n%s\n```\n\nKayıtlar: %s/%s/actions/runs/%s' "$(tail -n 25 /tmp/adim.log 2>/dev/null)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")" \
            --assignee yigitolmezcan \
            || echo "issue açılamadı"

      - name: Hata bildirimi
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hangi adımın düştüğünü bildirime YAZ. Önceki başarısızlıkta
          # bildirim sadece "başarısız" deyip kayıt bağlantısı veriyordu;
          # sebebi öğrenmek için her seferinde Actions'a girmek gerekti.
          DUSEN="bilinmiyor"
          [ "${{ steps.kurulum.outcome }}" = "failure" ] && DUSEN="Bağımlılıklar (pip install)"
          [ "${{ steps.testler.outcome }}" = "failure" ] && DUSEN="Testler"
          [ "${{ steps.uretim.outcome }}" = "failure" ] && DUSEN="Gece üretimi"
          [ "${{ steps.yazma.outcome }}" = "failure" ] && DUSEN="Depoya yazma"
          # HATANIN KENDİSİ bildirime giriyor. Önceki sürüm sadece
          # "başarısız oldu" deyip kayıt bağlantısı veriyordu; sebebi
          # öğrenmek için her seferinde Actions'a girip ekran görüntüsü
          # almak gerekiyordu ve teşhis turlarca sürüyordu.
          {
            echo "08:30 üretim işi **$DUSEN** adımında düştü."
            echo ""
            echo "Site DEĞİŞMEDİ, bir önceki gece yayında kalmaya devam ediyor."
            echo ""
            echo "### Hatanın son satırları"
            echo ""
            echo '```'
            tail -n 40 /tmp/adim.log 2>/dev/null || echo "(adım çıktısı yakalanamadı)"
            echo '```'
            echo ""
            echo "Tam kayıt: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/issue.md
          gh issue create \
            --title "Gece üretimi başarısız ($DUSEN) — $(date -u +%Y-%m-%d)" \
            --body-file /tmp/issue.md \
            --assignee yigitolmezcan
