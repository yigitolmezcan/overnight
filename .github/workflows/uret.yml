name: Gece üret (08:30 TSİ)

on:
  schedule:
    # GitHub cron UTC çalışır. Türkiye yıl boyu UTC+3 (yaz saati yok),
    # yani 05:30 UTC = 08:30 TSİ. Yaz/kış geçişi olmadığı için tek
    # satır yeterli — bu, TSİ'nin sabit ofsetli olmasının getirdiği
    # nadir kolaylıklardan biri.
    - cron: "30 5 * * *"
  workflow_dispatch:        # elle de çalıştırılabilsin (düğmeyle)

concurrency:
  group: overnight-yayin    # üret ve yayınla asla aynı anda commit atmasın
  cancel-in-progress: false

permissions:
  contents: write           # üretilen geceyi depoya commit'lemek için
  issues: write             # hata halinde bildirim issue'su açmak için

jobs:
  uret:
    runs-on: ubuntu-latest
    # 60 dk: NBA yavaşladığında yeniden denemeler süreyi uzatıyor.
    # En kötü durum hesabı ~39 dk (46 çağrı × 3 deneme × 15 sn), üstüne
    # pay bırakıldı.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bağımlılıklar
        id: kurulum
        run: pip install -r requirements.txt

      - name: Testler (bozuk kod yayına çıkmasın)
        id: testler
        run: |
          set -o pipefail
          python3 test_dogrula_bozuk.py 2>&1 | tee /tmp/adim.log

      - name: Sıradaki geceyi üret
        id: uretim
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GUNLUK_BUTCE_USD: "1.00"
        run: |
          set -o pipefail
          python3 yayin.py uret 2>&1 | tee /tmp/adim.log

      - name: Sonucu depoya yaz
        id: yazma
        run: |
          git config user.name  "overnight-bot"
          git config user.email "bot@users.noreply.github.com"
          git add config/yayin_durumu.json gercek dist skor taslak
          if git diff --staged --quiet; then
            echo "Değişiklik yok — commit atlanıyor."
          else
            git commit -m "üret: $(python3 -c "import json;print(json.load(open('config/yayin_durumu.json')).get('hazir',{}).get('tarih','-'))")"
            git push
          fi

      - name: Bütçe tavanı uyarısı
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASILDI=$(python3 -c "import json;d=json.load(open('config/yayin_durumu.json'));h=d.get('hazir') or {};print('evet' if h.get('butce_asildi') else 'hayir')")
          if [ "$ASILDI" = "evet" ]; then
            gh issue create \
              --title "Bütçe tavanı aşıldı — gece şablon moduna düştü" \
              --body "Günlük \$0.30 tavanına ulaşıldı. Gecenin kalanı şablonla üretildi; yayın normal saatinde çıkacak, sadece metinler LLM yerine şablondan geliyor. Ayrıntı: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      # Kullanıcı kuralı: her koşu, sonucu ne olursa olsun iz bıraksın.
      # if: always() — adımlardan biri düşse bile bu çalışır, yoksa
      # "çalıştı mı çalışmadı mı" sorusu tahmine kalıyor.
      - name: Koşu kaydı bırak
        if: always()
        run: |
          python3 kosu_kaydi.py uret "${{ job.status }}" "run ${{ github.run_number }} · ${{ github.event_name }}"
          git config user.name  "overnight-bot"
          git config user.email "bot@users.noreply.github.com"
          git add config/kosu_kaydi.json
          if ! git diff --staged --quiet; then
            git pull --rebase --autostash -q || true
            git commit -m "koşu kaydı: uret ${{ job.status }}"
            git push || echo "koşu kaydı push edilemedi (yarışma) — kayıt yine de üretildi"
          fi

      - name: Hata bildirimi
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hangi adımın düştüğünü bildirime YAZ. Önceki başarısızlıkta
          # bildirim sadece "başarısız" deyip kayıt bağlantısı veriyordu;
          # sebebi öğrenmek için her seferinde Actions'a girmek gerekti.
          DUSEN="bilinmiyor"
          [ "${{ steps.kurulum.outcome }}" = "failure" ] && DUSEN="Bağımlılıklar (pip install)"
          [ "${{ steps.testler.outcome }}" = "failure" ] && DUSEN="Testler"
          [ "${{ steps.uretim.outcome }}" = "failure" ] && DUSEN="Gece üretimi"
          [ "${{ steps.yazma.outcome }}" = "failure" ] && DUSEN="Depoya yazma"
          # HATANIN KENDİSİ bildirime giriyor. Önceki sürüm sadece
          # "başarısız oldu" deyip kayıt bağlantısı veriyordu; sebebi
          # öğrenmek için her seferinde Actions'a girip ekran görüntüsü
          # almak gerekiyordu ve teşhis turlarca sürüyordu.
          {
            echo "08:30 üretim işi **$DUSEN** adımında düştü."
            echo ""
            echo "Site DEĞİŞMEDİ, bir önceki gece yayında kalmaya devam ediyor."
            echo ""
            echo "### Hatanın son satırları"
            echo ""
            echo '```'
            tail -n 40 /tmp/adim.log 2>/dev/null || echo "(adım çıktısı yakalanamadı)"
            echo '```'
            echo ""
            echo "Tam kayıt: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/issue.md
          gh issue create \
            --title "Gece üretimi başarısız ($DUSEN) — $(date -u +%Y-%m-%d)" \
            --body-file /tmp/issue.md
