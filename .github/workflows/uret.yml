name: Gece üret (08:30 TSİ)

on:
  schedule:
    # GitHub cron UTC çalışır; Türkiye yıl boyu UTC+3 (yaz saati yok).
    #
    # ÜÇ SLOT, tek değil. Ölçüm (2026-08-26): GitHub zamanlanmış işi
    # 27 dk gecikmeyle başlattı, yayın işini 41 dk. Tek slota bağlıyken
    # gecikme doğrudan yayın saatine biniyor ve "09:00'da yayında"
    # vaadi tutmuyor. Slotlar İDEMPOTENT: hazır gece varsa üretim
    # atlanıyor, yani fazladan koşu zarar vermiyor, sadece kaçan slotu
    # telafi ediyor.
    #
    # ARŞİV MODU: veri her zaman hazır, o yüzden çok erken üretiyoruz.
    #   02:00 UTC = 05:00 TSİ  (asıl)
    #   04:00 UTC = 07:00 TSİ  (telafi)
    #   05:30 UTC = 08:30 TSİ  (son şans)
    # CANLI MODA geçince ilk iki slot ÇALIŞMAZ — o saatte maçlar
    # bitmemiş olur. Canlı modda 05:30 UTC (08:30 TSİ) ve sonrası
    # kullanılmalı; `python3 yayin.py canli` bunu hatırlatıyor.
    - cron: "0 2 * * *"
    - cron: "0 4 * * *"
    - cron: "30 5 * * *"
  workflow_dispatch:        # elle de çalıştırılabilsin (düğmeyle)

concurrency:
  group: overnight-yayin    # üret ve yayınla asla aynı anda commit atmasın
  cancel-in-progress: false

permissions:
  contents: write           # üretilen geceyi depoya commit'lemek için
  issues: write             # hata halinde bildirim issue'su açmak için

jobs:
  uret:
    runs-on: ubuntu-latest
    # 60 dk: NBA yavaşladığında yeniden denemeler süreyi uzatıyor.
    # En kötü durum hesabı ~39 dk (46 çağrı × 3 deneme × 15 sn), üstüne
    # pay bırakıldı.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bağımlılıklar
        id: kurulum
        run: pip install -r requirements.txt

      - name: Testler (bozuk kod yayına çıkmasın)
        id: testler
        run: |
          set -o pipefail
          python3 test_dogrula_bozuk.py 2>&1 | tee /tmp/adim.log

      - name: Sıradaki geceyi üret
        id: uretim
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GUNLUK_BUTCE_USD: "1.00"
        run: |
          set -o pipefail
          # ÜÇ DENEME, aralarında 10 dakika.
          #
          # Neden: gecenin üretilebilmesi için NBA'in veri servisine bir
          # kez ulaşmak yetiyor, ama o servis dönemsel olarak tıkanıyor
          # (27 Ağustos: saatlerce HTTP 000, hem koşucudan hem yerelden).
          # Zamanlayıcı bize günde tek tetikleme veriyor; o tetikleme
          # tıkanmanın ortasına denk gelirse gece kaybediliyordu.
          #
          # Süre hesabı: cek.py'nin kendi bütçesi tıkalı serviste ~70
          # saniyede pes ediyor (ölçüldü), üç deneme + iki bekleme ≈ 25
          # dakika. İş tavanı 60 dakika, rahat sığıyor.
          #
          # İş İDEMPOTENT: hazır gece varsa `yayin.py uret` zaten hiçbir
          # şey yapmadan çıkıyor, o yüzden başarılı denemeden sonra
          # döngü kırılıyor.
          for deneme in 1 2 3; do
            echo "--- üretim denemesi $deneme/3 ---"
            if python3 yayin.py uret 2>&1 | tee -a /tmp/adim.log; then
              echo "deneme $deneme başarılı"
              exit 0
            fi
            if [ "$deneme" -lt 3 ]; then
              echo "deneme $deneme düştü, 10 dakika sonra tekrar denenecek"
              sleep 600
            fi
          done
          echo "üç denemede de üretilemedi"
          exit 1

      - name: Sonucu depoya yaz
        id: yazma
        run: |
          git config user.name  "overnight-bot"
          git config user.email "bot@users.noreply.github.com"
          git add config/yayin_durumu.json gercek dist skor taslak
          if git diff --staged --quiet; then
            echo "Değişiklik yok — commit atlanıyor."
          else
            git commit -m "üret: $(python3 -c "import json;print(json.load(open('config/yayin_durumu.json')).get('hazir',{}).get('tarih','-'))")"
            git push
          fi

      - name: Bütçe tavanı uyarısı
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASILDI=$(python3 -c "import json;d=json.load(open('config/yayin_durumu.json'));h=d.get('hazir') or {};print('evet' if h.get('butce_asildi') else 'hayir')")
          if [ "$ASILDI" = "evet" ]; then
            gh issue create \
              --title "Bütçe tavanı aşıldı — gece şablon moduna düştü" \
              --body "Günlük \$0.30 tavanına ulaşıldı. Gecenin kalanı şablonla üretildi; yayın normal saatinde çıkacak, sadece metinler LLM yerine şablondan geliyor. Ayrıntı: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --assignee yigitolmezcan
          fi

      # Kullanıcı kuralı: her koşu, sonucu ne olursa olsun iz bıraksın.
      # if: always() — adımlardan biri düşse bile bu çalışır, yoksa
      # "çalıştı mı çalışmadı mı" sorusu tahmine kalıyor.
      - name: Koşu kaydı bırak
        if: always()
        run: |
          python3 kosu_kaydi.py uret "${{ job.status }}" "run ${{ github.run_number }} · ${{ github.event_name }}"
          git config user.name  "overnight-bot"
          git config user.email "bot@users.noreply.github.com"
          git add config/kosu_kaydi.json
          if ! git diff --staged --quiet; then
            git pull --rebase --autostash -q || true
            git commit -m "koşu kaydı: uret ${{ job.status }}"
            git push || echo "koşu kaydı push edilemedi (yarışma) — kayıt yine de üretildi"
          fi

      # Kullanıcı kuralı: "Başarısızsa bana e-posta gelsin." Issue kalıyor
      # (izlenebilirlik), üstüne mail ekleniyor — kimse Issues sekmesine
      # bakmıyor. Bu adım işin sonucunu DEĞİŞTİRMİYOR: uyari.py mail
      # atamasa bile 0 dönüyor.
      - name: Arıza e-postası
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UYARI_ADRESI: ${{ secrets.UYARI_ADRESI }}
          GONDEREN_ADRES: ${{ vars.GONDEREN_ADRES }}
        run: |
          python3 uyari.py "OVERNIGHT · üretim işi başarısız ($(date -u +%Y-%m-%d))" \
            "üretim işi düştü." \
            "Son satırlar: $(tail -n 6 /tmp/adim.log 2>/dev/null | tr '\n' ' ' | cut -c1-400)" \
            "Tam kayıt: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Hata bildirimi
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hangi adımın düştüğünü bildirime YAZ. Önceki başarısızlıkta
          # bildirim sadece "başarısız" deyip kayıt bağlantısı veriyordu;
          # sebebi öğrenmek için her seferinde Actions'a girmek gerekti.
          DUSEN="bilinmiyor"
          [ "${{ steps.kurulum.outcome }}" = "failure" ] && DUSEN="Bağımlılıklar (pip install)"
          [ "${{ steps.testler.outcome }}" = "failure" ] && DUSEN="Testler"
          [ "${{ steps.uretim.outcome }}" = "failure" ] && DUSEN="Gece üretimi"
          [ "${{ steps.yazma.outcome }}" = "failure" ] && DUSEN="Depoya yazma"
          # HATANIN KENDİSİ bildirime giriyor. Önceki sürüm sadece
          # "başarısız oldu" deyip kayıt bağlantısı veriyordu; sebebi
          # öğrenmek için her seferinde Actions'a girip ekran görüntüsü
          # almak gerekiyordu ve teşhis turlarca sürüyordu.
          {
            echo "08:30 üretim işi **$DUSEN** adımında düştü."
            echo ""
            echo "Site DEĞİŞMEDİ, bir önceki gece yayında kalmaya devam ediyor."
            echo ""
            echo "### Hatanın son satırları"
            echo ""
            echo '```'
            tail -n 40 /tmp/adim.log 2>/dev/null || echo "(adım çıktısı yakalanamadı)"
            echo '```'
            echo ""
            echo "Tam kayıt: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/issue.md
          gh issue create \
            --title "Gece üretimi başarısız ($DUSEN) — $(date -u +%Y-%m-%d)" \
            --body-file /tmp/issue.md \
            --assignee yigitolmezcan
